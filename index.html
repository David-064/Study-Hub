    <style>
      :root {
        --bg: #fff4c2;
        --ink: #1b1b2f;
        --card: #ffffff;
        --muted: #4a4a68;
        --pink: #ff6b9d;
        --blue: #4cc9f0;
        --green: #7bd88f;
        --orange: #ff9f43;
        --purple: #a78bfa;
        --yellow: #ffd93d;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #241f3d;
          --ink: #fff7d6;
          --card: #34305a;
          --muted: #cfcaf0;
        }
      }
      :root[data-theme="dark"] {
        --bg: #241f3d;
        --ink: #fff7d6;
        --card: #34305a;
        --muted: #cfcaf0;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        scroll-behavior: smooth;
      }
      body {
        background-color: var(--bg);
        color: var(--ink);
        font-family: "Fredoka", "Comic Sans MS", system-ui, sans-serif;
        background-image: radial-gradient(var(--ink) 1.2px, transparent 1.2px);
        background-size: 26px 26px;
        background-position: 0 0;
      }
      .dots-fade {
        background: var(--bg);
      }
      .bangers {
        font-family: "Bangers", "Impact", system-ui, sans-serif;
        letter-spacing: 0.04em;
      }
      .pop {
        border: 4px solid #1b1b2f;
        box-shadow: 6px 6px 0 #1b1b2f;
        border-radius: 22px;
      }
      .pop-sm {
        border: 3px solid #1b1b2f;
        box-shadow: 4px 4px 0 #1b1b2f;
        border-radius: 16px;
      }
      .press {
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      .press:hover {
        transform: translate(-2px, -2px) rotate(-1deg);
        box-shadow: 8px 8px 0 #1b1b2f;
      }
      .press:active {
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 #1b1b2f;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 4px solid var(--ink);
        outline-offset: 3px;
      }
      .card {
        background: var(--card);
        color: var(--ink);
      }
      .title-bounce {
        animation: bounce 1.6s ease-in-out 1;
      }
      @keyframes bounce {
        0% {
          transform: translateY(-30px) rotate(-4deg);
          opacity: 0;
        }
        60% {
          transform: translateY(6px) rotate(2deg);
          opacity: 1;
        }
        100% {
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .title-bounce {
          animation: none;
        }
        html {
          scroll-behavior: auto;
        }
        .press {
          transition: none;
        }
      }
    </style>
  </head>

          transform: rotate(-2deg);

      </div>

        Semester 2, first term. Pick a course and jump into your Notion notes.

        aria-label="Courses"

    </header>
